<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d1c">

<title>Domain Suspended</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial, sans-serif;
    background:
    radial-gradient(circle at 15% 15%,#25204b 0,transparent 35%),
    radial-gradient(circle at 85% 85%,#172c50 0,transparent 35%),
    #090d1c;
    color:#fff;
}

.container{
    width:100%;
    max-width:460px;
    padding:45px 30px;
    text-align:center;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.icon{
    width:85px;
    height:85px;
    margin:0 auto 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:24px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.25);
}

.icon svg{
    width:43px;
    height:43px;
    stroke:#fb7185;
}

.badge{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.25);
    color:#fb7185;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    margin-bottom:22px;
}

h1{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1px;
    margin-bottom:15px;
}

.description{
    color:#a7b0c5;
    font-size:14px;
    line-height:1.8;
    margin-bottom:30px;
}

.divider{
    height:1px;
    background:rgba(255,255,255,.09);
    margin:25px 0;
}

.info{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:#cbd5e1;
    font-size:12px;
}

.info svg{
    width:16px;
    height:16px;
    stroke:#818cf8;
}

.footer{
    margin-top:35px;
    color:#65718a;
    font-size:11px;
    letter-spacing:.5px;
}

@media(max-width:480px){
    .container{
        padding:38px 23px;
        border-radius:20px;
    }

    h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"
        stroke-width="1.7" stroke-linecap="round"
        stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v6"/>
            <path d="M12 16.5v.1"/>
        </svg>
    </div>

    <div class="badge">
        ● DOMAIN SUSPENDED
    </div>

    <h1>Website Temporarily<br>Unavailable</h1>

    <p class="description">
        This domain has been temporarily suspended.
        The website is currently unavailable.
        Please contact the website administrator
        for further information.
    </p>

    <div class="divider"></div>

    <div class="info">
        <svg viewBox="0 0 24 24" fill="none"
        stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 11v5"/>
            <path d="M12 8h.01"/>
        </svg>

        <span>Service Temporarily Suspended</span>
    </div>

    <div class="footer">
        © <span id="year"></span> · ALL RIGHTS RESERVED
    </div>

</div>

<script>
document.getElementById("year").textContent =
new Date().getFullYear();
</script>

</body>
</html>
